<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>cube</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: url('companion_background.png') no-repeat center center fixed;
      background-size: cover;
      font-family: Tahoma, Verdana, Arial, sans-serif;
    }

    #loading-indicator {
      position: absolute;
      top: 20px;
      left: 20px;
      display: flex;
      align-items: center;
      color: white;
      font-size: 18px;
      font-weight: bold;
    }

    #loading-indicator img {
      height: 24px;
      margin-right: 10px;
    }

    #center-logo {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    #center-logo img {
      max-width: 100%;
      height: auto;
    }
  </style>
  <script>
    window.onload = function() {
      setTimeout(() => {
        window.location.href = "hcube.html";
      }, 3000);
    };
  </script>
</head>
<body>

  <div id="loading-indicator">
    <img src="spinner_loading.gif" alt="Loading">
    Loading
  </div>

  <div id="center-logo">
    <img src="hulu_color_large.png">
  </div>

</body>
</html>
