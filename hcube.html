<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<title>cube</title>
<style>
html, body {
    margin: 0;
    padding: 0;
    font-family: Tahoma, Verdana, Arial, sans-serif;
    color: #fff;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background-image: url('companion_background.png');
    background-size: cover;
    background-position: center;
}

.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 20px;
    border-bottom: 1px solid #444;
}

.logo {
    display: flex;
    align-items: center;
}

.search-bar {
    position: relative;
    display: flex;
    align-items: center;
}

.search-bar input {
    border: none;
    background: url('searchbox_unfocused.png') no-repeat right center;
    background-size: contain;
    padding: 10px 45px 10px 15px;
    color: black;
    outline: none;
    box-sizing: border-box;
}

.search-bar input:focus {
    background-image: url('searchbox_focused.png');
}

.nav-bar {
    display: flex;
    justify-content: center;
    padding: 10px;
    border-bottom: 1px solid #444;
}

.nav-bar a {
    color: #bbb;
    margin: 0 20px;
    text-decoration: none;
    font-size: 18px;
    padding: 8px 16px;
    border: 3px solid transparent;
    outline: none;
}

.nav-bar a:focus {
    background: linear-gradient(to bottom, #5C9730, #4c7c28);
    border: 3px solid #fff;
    color: #fff;
}

.main-content {
    flex-grow: 1;
    display: flex;
    justify-content: center;
    padding: 20px 0;
}

.content-section {
    display: flex;
    justify-content: center;
}

.content-items {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
}

.content-item {
    width: 220px;
    height: 124px;
    border: 3px solid transparent;
    overflow: hidden;
    box-sizing: border-box;
}

.content-item:focus {
    border: 3px solid #fff;
    background: rgba(255, 255, 255, 0.05);
}

.content-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}
</style>
</head>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const focusables = [
        document.getElementById('searchInput'),
        ...document.querySelectorAll('.nav-link'),
        ...document.querySelectorAll('.content-item')
    ];
    let currentIndex = 0;
    focusables[currentIndex]?.focus();
    document.addEventListener('keydown', (e) => {
        const columns = 4;
        let newIndex = currentIndex;
        if (e.key === 'ArrowRight') newIndex = (currentIndex + 1) % focusables.length;
        else if (e.key === 'ArrowLeft') newIndex = (currentIndex - 1 + focusables.length) % focusables.length;
        else if (e.key === 'ArrowDown') {
            if (currentIndex + columns < focusables.length) newIndex = currentIndex + columns;
        } else if (e.key === 'ArrowUp') {
            if (currentIndex - columns >= 0) newIndex = currentIndex - columns;
        } else if (e.key === 'Enter') {
            if (focusables[currentIndex].tagName === 'A' || focusables[currentIndex].classList.contains('content-item')) {
                focusables[currentIndex].click();
            } else if (focusables[currentIndex].tagName === 'INPUT') {
                focusables[currentIndex].focus();
            }
        }
        if (newIndex !== currentIndex) {
            currentIndex = newIndex;
            focusables[currentIndex].focus();
        }
    });
});
function handleSearch(event) {
    event.preventDefault();
    const query = document.getElementById('searchInput').value.toLowerCase();
    const items = document.querySelectorAll('.content-item');

    items.forEach(item => {
        const title = item.querySelector('img').alt.toLowerCase();
        item.style.display = title.includes(query) ? 'block' : 'none';
    });
}
</script>
